[project]
name = "diabetes-risk-ml"
version = "0.1.0"
description = "Machine learning project for diabetes risk prediction"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn==1.7.2",
    "lightgbm",
    "joblib",
    "pyyaml>=6.0.3",
    "mlflow>=3.18.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]